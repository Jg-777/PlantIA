<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlantIA | Inteligencia para el cuidado de tus plantas</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --bg:#f3f7f4;
  --surface:#ffffff;
  --surface-soft:#ecf4ee;
  --green-primary:#1f6b43;
  --green-dark:#123f27;
  --green-mid:#2d8556;
  --green-light:#e2f1e6;
  --mint:#cbe9d4;
  --text:#17261c;
  --muted:#5a6b5e;
  --border:#d5e3d8;
  --gold:#f2c144;
  --gold-dark:#3d2f08;
  --amber:#d97706;
  --amber-bg:#fef3c7;
  --danger:#c92a2a;
  --danger-bg:#fff5f5;
  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:22px;
  --sidebar-w:256px;
  --shadow-sm:0 4px 12px rgba(18,63,39,.05);
  --shadow-md:0 12px 28px -6px rgba(18,63,39,.10);
  --shadow-lg:0 20px 40px -12px rgba(18,63,39,.16);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}

body{
  background:var(--bg);
  color:var(--text);
  font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
.muted{color:var(--muted)}

/* Animations */
@keyframes fadeSlideIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes cardPop{
  from{opacity:0;transform:translateY(10px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

@keyframes gentleLeaf{
  0%,100%{transform:scale(1) rotate(0deg)}
  50%{transform:scale(1.05) rotate(2.5deg)}
}

@keyframes pulseRing{
  0%{box-shadow:0 0 0 0 rgba(31,107,67,.35)}
  70%{box-shadow:0 0 0 14px rgba(31,107,67,0)}
  100%{box-shadow:0 0 0 0 rgba(31,107,67,0)}
}

@keyframes shimmer{
  0%{background-position:-200% 0}
  100%{background-position:200% 0}
}

@keyframes cartBounce{
  0%,100%{transform:scale(1)}
  40%{transform:scale(1.22)}
  70%{transform:scale(.95)}
}

.view-enter{animation:fadeSlideIn .24s ease-out both}
.leaf-float{animation:gentleLeaf 3.6s ease-in-out infinite}
.pulse-ai{animation:pulseRing 1.8s infinite}
.badge-bounce{animation:cartBounce .38s ease}

.stagger > *{
  opacity:0;
  animation:cardPop .32s ease-out forwards;
}
.stagger > *:nth-child(1){animation-delay:.03s}
.stagger > *:nth-child(2){animation-delay:.07s}
.stagger > *:nth-child(3){animation-delay:.11s}
.stagger > *:nth-child(4){animation-delay:.15s}
.stagger > *:nth-child(5){animation-delay:.19s}
.stagger > *:nth-child(6){animation-delay:.23s}
.stagger > *:nth-child(7){animation-delay:.27s}
.stagger > *:nth-child(8){animation-delay:.31s}

.skeleton{
  background:linear-gradient(90deg,#e7efe9 25%,#f4f9f5 50%,#e7efe9 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite linear;
  border-radius:var(--radius-sm);
}

/* Login / Auth */
.login-screen{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  background:
    radial-gradient(circle at 15% 10%, rgba(45,133,86,.16), transparent 42%),
    radial-gradient(circle at 85% 90%, rgba(242,193,68,.18), transparent 45%),
    var(--bg);
}

.login-box{
  width:100%;
  max-width:430px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:32px 28px;
  box-shadow:var(--shadow-lg);
  animation:cardPop .35s ease-out both;
}

.login-brand{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  margin-bottom:22px;
}

.brandmark{
  height:42px;
  width:42px;
  border-radius:13px;
  background:linear-gradient(135deg,var(--green-mid),var(--green-primary));
  color:#fff;
  display:grid;
  place-items:center;
  box-shadow:0 8px 18px rgba(31,107,67,.25);
  flex-shrink:0;
}

.brandmark.lg{height:58px;width:58px;border-radius:16px;margin-bottom:12px}

.brand{
  font-weight:800;
  font-size:1.22rem;
  color:var(--green-dark);
  letter-spacing:-.02em;
  line-height:1.15;
}

.brand small{
  display:block;
  color:var(--muted);
  font-size:.75rem;
  font-weight:500;
  margin-top:2px;
}

.login-title{
  margin:0 0 6px;
  font-size:1.45rem;
  font-weight:800;
  color:var(--green-dark);
  text-align:center;
}

.login-desc{
  margin:0 0 22px;
  font-size:.92rem;
  color:var(--muted);
  text-align:center;
}

.login-error{
  color:var(--danger);
  background:var(--danger-bg);
  border-radius:var(--radius-sm);
  padding:0 12px;
  font-size:.85rem;
  font-weight:600;
  margin-bottom:12px;
  max-height:0;
  overflow:hidden;
  opacity:0;
  transition:all .2s ease;
}

.login-error.show{
  padding:9px 12px;
  max-height:90px;
  opacity:1;
}

/* App Shell & Sidebar */
.app-shell{
  min-height:100vh;
  display:grid;
  grid-template-columns:var(--sidebar-w) 1fr;
}

.sidebar{
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
  z-index:40;
  transition:transform .25s ease;
}

.sidebar-head{
  padding:20px 18px 16px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:12px;
}

.ai-status{
  margin:14px 16px 6px;
  padding:8px 12px;
  border-radius:var(--radius-sm);
  background:var(--surface-soft);
  border:1px solid var(--border);
  font-size:.78rem;
  font-weight:600;
  color:var(--green-dark);
  display:flex;
  align-items:center;
  gap:8px;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 0 3px rgba(34,197,94,.2);
  flex-shrink:0;
}

.nav-scroll{
  flex:1;
  overflow-y:auto;
  padding:10px 12px;
}

.nav-group-label{
  font-size:.7rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--muted);
  padding:12px 10px 6px;
}

.nav-list{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.nav-item{
  width:100%;
  text-align:left;
  color:var(--text);
  border-radius:var(--radius-sm);
  padding:10px 12px;
  font-size:.9rem;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:10px;
  transition:background .16s ease,color .16s ease,transform .12s ease;
}

.nav-item:hover{
  background:var(--surface-soft);
  color:var(--green-dark);
  transform:translateX(2px);
}

.nav-item.active{
  background:var(--green-primary);
  color:#fff;
  box-shadow:0 6px 14px rgba(31,107,67,.22);
}

.nav-item.active .pill{
  background:rgba(255,255,255,.24);
  color:#fff;
}

.nav-item .nav-label{flex:1}

.sidebar-foot{
  padding:14px;
  border-top:1px solid var(--border);
  background:#fafcfa;
}

.user-card{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 10px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  margin-bottom:10px;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:10px;
  background:var(--mint);
  color:var(--green-dark);
  font-weight:800;
  display:grid;
  place-items:center;
  flex-shrink:0;
}

.user-meta{min-width:0;flex:1}
.user-meta strong{
  display:block;
  font-size:.86rem;
  color:var(--green-dark);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.role-badge{
  display:inline-block;
  background:var(--green-light);
  color:var(--green-primary);
  font-size:.68rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
  padding:1px 7px;
  border-radius:999px;
}

.sidebar-overlay{
  position:fixed;
  inset:0;
  background:rgba(15,35,23,.45);
  backdrop-filter:blur(2px);
  z-index:35;
}

/* Main Workspace */
.workspace{
  display:flex;
  flex-direction:column;
  min-width:0;
}

.topbar{
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:12px 24px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:25;
}

.menu-toggle{
  display:none;
  width:38px;
  height:38px;
  border-radius:10px;
  background:var(--surface-soft);
  color:var(--green-dark);
  place-items:center;
}

.breadcrumb{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:.88rem;
  color:var(--muted);
}

.breadcrumb strong{color:var(--green-dark)}
.spacer{flex:1}

main{
  width:100%;
  max-width:1160px;
  margin:0 auto;
  padding:24px 24px 48px;
  flex:1;
}

/* Buttons */
.btn{
  border-radius:var(--radius-sm);
  padding:10px 16px;
  font-weight:600;
  font-size:.9rem;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:var(--green-primary);
  color:#fff;
  transition:transform .12s ease,background .18s ease,box-shadow .18s ease;
}

.btn:hover:not(:disabled){
  background:var(--green-dark);
  box-shadow:0 6px 16px rgba(18,63,39,.18);
}

.btn:active:not(:disabled){transform:scale(.98)}
.btn.sm{padding:7px 12px;font-size:.83rem;border-radius:8px}
.btn.xs{padding:5px 9px;font-size:.8rem;border-radius:7px}
.btn.full{width:100%}
.btn.secondary{background:var(--surface-soft);color:var(--green-dark);border:1px solid var(--border)}
.btn.secondary:hover:not(:disabled){background:var(--green-light);box-shadow:none}
.btn.gold{background:var(--gold);color:var(--gold-dark);font-weight:700}
.btn.gold:hover:not(:disabled){background:#e6b332}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger:hover:not(:disabled){background:#a61e1e}
.btn:disabled{opacity:.48;cursor:not-allowed;box-shadow:none}

/* Category Chips */
.chip-bar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:18px;
}

.chip{
  padding:7px 14px;
  border-radius:999px;
  font-size:.84rem;
  font-weight:600;
  background:var(--surface);
  color:var(--muted);
  border:1px solid var(--border);
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:all .16s ease;
}

.chip:hover{
  background:var(--surface-soft);
  color:var(--green-dark);
}

.chip.active{
  background:var(--green-primary);
  color:#fff;
  border-color:var(--green-primary);
  box-shadow:0 4px 10px rgba(31,107,67,.2);
}

/* Hero & Cards */
.hero{
  background:linear-gradient(125deg,var(--green-dark) 0%,var(--green-primary) 62%,var(--green-mid) 100%);
  color:#fff;
  border-radius:var(--radius-lg);
  padding:clamp(26px,4vw,44px);
  display:grid;
  grid-template-columns:1.55fr 1fr;
  gap:28px;
  align-items:center;
  box-shadow:var(--shadow-md);
  position:relative;
  overflow:hidden;
}

.hero::after{
  content:"";
  position:absolute;
  right:-60px;
  bottom:-60px;
  width:240px;
  height:240px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);
  pointer-events:none;
}

.eyebrow{
  display:inline-block;
  text-transform:uppercase;
  letter-spacing:.09em;
  font-size:.73rem;
  font-weight:700;
  color:#b6f0c6;
  background:rgba(255,255,255,.12);
  padding:4px 10px;
  border-radius:999px;
  margin-bottom:12px;
}

.hero h1{
  font-size:clamp(1.75rem,3.4vw,2.65rem);
  line-height:1.12;
  margin:0 0 12px;
  letter-spacing:-.02em;
}

.hero p{
  color:#e4f3e8;
  margin:0 0 22px;
  font-size:1rem;
  max-width:52ch;
}

.hero-actions{display:flex;flex-wrap:wrap;gap:10px}

.hero-visual{
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
  border-radius:var(--radius-md);
  padding:30px;
}

.section-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
  margin:24px 0 18px;
}

.section-head:first-child{margin-top:0}

.section-head h2{
  margin:0;
  font-size:1.38rem;
  color:var(--green-dark);
  letter-spacing:-.015em;
}

.section-head p{margin:3px 0 0;font-size:.91rem}

.search-input{
  min-width:250px;
  padding:9px 14px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:var(--surface);
  font-size:.9rem;
}

.search-input:focus{outline:2px solid var(--green-primary);border-color:transparent}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:18px;
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:22px;
  box-shadow:var(--shadow-sm);
  transition:transform .18s ease,box-shadow .18s ease;
}

.card.hoverable:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow-md);
}

.card h3{margin:0 0 8px;color:var(--green-dark);font-size:1.06rem}

.iconbox{
  height:44px;
  width:44px;
  border-radius:12px;
  background:var(--green-light);
  color:var(--green-primary);
  display:grid;
  place-items:center;
  margin-bottom:14px;
}

.stat-value{
  font-size:1.9rem;
  font-weight:800;
  color:var(--green-primary);
  margin:4px 0 0;
}

/* Forms & Diagnostic */
.field{margin-bottom:14px}
.field label{
  display:block;
  font-weight:600;
  font-size:.86rem;
  color:var(--green-dark);
  margin-bottom:6px;
}

.field input,.field select,.field textarea{
  width:100%;
  padding:10px 13px;
  border:1px solid #c3d5c7;
  border-radius:var(--radius-sm);
  background:#fff;
  font-size:.92rem;
  transition:border-color .15s ease,box-shadow .15s ease;
}

.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;
  border-color:var(--green-primary);
  box-shadow:0 0 0 3px rgba(31,107,67,.14);
}

.diagnostic-layout{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  align-items:start;
}

.dropzone{
  border:2px dashed #9ec2a6;
  border-radius:var(--radius-md);
  padding:22px;
  text-align:center;
  background:#f8fcf9;
  cursor:pointer;
  transition:border-color .18s ease,background .18s ease,transform .18s ease;
}

.dropzone:hover,.dropzone.drag-over{
  border-color:var(--green-primary);
  background:var(--green-light);
  transform:translateY(-2px);
}

.dropzone p{margin:6px 0 0}

.preview-container{margin-top:12px}
.preview{
  width:100%;
  max-height:220px;
  object-fit:cover;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  margin-bottom:10px;
}

.diag-block{
  background:var(--surface-soft);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:14px 16px;
  margin-bottom:12px;
}

.diag-block h4{
  margin:0 0 6px;
  font-size:.86rem;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:var(--green-primary);
}

.diag-loader{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:42px 16px;
  text-align:center;
  gap:14px;
}

.diag-loader-icon{
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--green-light);
  color:var(--green-primary);
  display:grid;
  place-items:center;
}

.pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:var(--mint);
  color:var(--green-dark);
  border-radius:999px;
  padding:2px 8px;
  font-size:.75rem;
  font-weight:700;
  line-height:1.3;
}

/* Products & Cart */
.product-card{display:flex;flex-direction:column;justify-content:space-between}

.product-img-box{
  height:172px;
  background:var(--green-light);
  border-radius:12px;
  overflow:hidden;
  margin-bottom:14px;
  display:grid;
  place-items:center;
  color:var(--green-primary);
  position:relative;
}

.product-img-box img{width:100%;height:100%;object-fit:cover}

.cat-tag{
  position:absolute;
  top:10px;
  left:10px;
  background:rgba(18,63,39,.86);
  color:#fff;
  font-size:.7rem;
  font-weight:700;
  padding:3px 9px;
  border-radius:999px;
  backdrop-filter:blur(4px);
}

.stock-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-top:10px;
  padding:3px 9px;
  border-radius:999px;
  font-size:.78rem;
  font-weight:700;
}

.stock-badge.ok{background:var(--green-light);color:var(--green-primary)}
.stock-badge.low{background:var(--amber-bg);color:var(--amber)}
.stock-badge.out{background:var(--danger-bg);color:var(--danger)}

.product-foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:16px;
  padding-top:12px;
  border-top:1px solid var(--border);
}

.price{font-size:1.15rem;font-weight:800;color:var(--green-primary)}

.qty-stepper{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--surface-soft);
  border:1px solid var(--border);
  border-radius:8px;
  padding:3px 6px;
}

.qty-stepper button{
  width:24px;
  height:24px;
  border-radius:6px;
  display:grid;
  place-items:center;
  font-weight:700;
  color:var(--green-dark);
}

.qty-stepper button:hover:not(:disabled){background:var(--mint)}
.qty-stepper button:disabled{opacity:.35;cursor:not-allowed}

.cart-total-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid var(--border);
}

.empty-state{
  text-align:center;
  padding:36px 16px;
}

.empty-state .iconbox{margin:0 auto 12px;width:52px;height:52px}

/* Botanical Guide & Presets */
.npk-badges{
  display:flex;
  gap:6px;
  margin:10px 0;
  flex-wrap:wrap;
}

.npk-pill{
  font-size:.74rem;
  font-weight:700;
  padding:3px 8px;
  border-radius:6px;
  background:var(--surface-soft);
  color:var(--green-dark);
  border:1px solid var(--border);
}

.preset-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:12px;
  margin-top:12px;
}

.preset-item{
  border:1px solid var(--border);
  background:var(--surface-soft);
  border-radius:var(--radius-sm);
  padding:12px 14px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:8px;
}

.preset-item strong{color:var(--green-dark);font-size:.92rem}
.preset-item small{color:var(--muted);font-size:.8rem;display:block}

/* Tables */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.91rem}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border)}
th{
  background:var(--green-light);
  color:var(--green-dark);
  font-weight:700;
  font-size:.82rem;
  text-transform:uppercase;
  letter-spacing:.03em;
}
tbody tr:hover{background:#f9fcf9}

/* Mobile Bottom Nav */
.mobile-bottom-nav{
  display:none;
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  z-index:30;
  padding:6px 8px;
  justify-content:space-around;
}

async function apiFetch(path, options = {}) {
  const headers = new Headers(options.headers || {});
  if (token) headers.set('Authorization', 'Bearer ' + token);
  if (options.body && !(options.body instanceof FormData) && !headers.has('Content-Type')) {
    headers.set('Content-Type', 'application/json');
  }
  const response = await fetch(API_BASE + path, { ...options, headers });
  let payload = {};
  try { payload = await response.json(); } catch {}

  if (response.status === 401 && token) {
    logout();
    toast('Tu sesión expiró. Inicia sesión nuevamente.');
    throw new Error('Sesión expirada');
  }

  if (!response.ok || payload.success === false) {
    throw new Error(payload.message || payload.error || `Error HTTP ${response.status}`);
  }
  return payload;
}

function toggleRegister() {
  registerMode = !registerMode;
  $('registerNameGroup').classList.toggle('hidden', !registerMode);
  $('loginTitle').textContent = registerMode ? 'Crear cuenta' : '¡Bienvenido!';
  $('loginDescription').textContent = registerMode
    ? 'Regístrate para comenzar a cuidar tus plantas.'
    : 'Ingresa tus datos para acceder a la plataforma.';
  $('loginButton').textContent = registerMode ? 'Registrarme' : 'Ingresar a PlantIA';
  $('registerButton').classList.toggle('hidden', registerMode);
  $('backLoginButton').classList.toggle('hidden', !registerMode);
  setLoginError('');
}

async function login() {
  const username = $('username').value.trim();
  const password = $('password').value;
  setLoginError('');

  if (!username || !password) {
    setLoginError('Ingresa tu usuario y contraseña.');
    return;
  }

  const button = $('loginButton');
  button.disabled = true;
  try {
    if (registerMode) {
      const name = $('registerName').value.trim();
      if (!name) throw new Error('Ingresa tu nombre completo.');
      await apiFetch('/api/auth/register', {
        method: 'POST',
        body: JSON.stringify({ username, name, password })
      });
      registerMode = false;
      toggleRegister();
      $('username').value = username;
      $('password').value = password;
      toast('Cuenta creada. Ahora inicia sesión.');
      return;
    }

    const result = await apiFetch('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({ username, password })
    });
    token = result.data.token;
    currentUser = result.data.user;
    localStorage.setItem('plantiaToken', token);
    await openApp();
  } catch (err) {
    setLoginError(err.message);
  } finally {
    button.disabled = false;
  }
}

async function restoreSession() {
  if (!token) return;
  try {
    const result = await apiFetch('/api/auth/me');
    currentUser = result.data;
    await openApp();
  } catch {
    token = '';
    currentUser = null;
    localStorage.removeItem('plantiaToken');
  }
}

async function openApp() {
  role = currentUser.role || 'cliente';
  const displayName = currentUser.name || currentUser.username || 'Usuario';
  $('loginScreen').classList.add('hidden');
  $('appScreen').classList.remove('hidden');
  $('currentUser').textContent = displayName;
  $('currentRoleBadge').textContent = role;
  $('userAvatar').textContent = displayName.charAt(0).toUpperCase();

  isLoadingData = true;
  const startView = role === 'admin' ? 'admin' : role === 'ventas' ? 'ventas' : 'inicio';
  go(startView);

  await refreshData();
  isLoadingData = false;
  go(active);
}

function logout() {

  $('password').value = '';
  $('username').value = '';
  setLoginError('');
  role = 'cliente';
}

  const count = cart.reduce((a, x) => a + x.qty, 0);

  $('nav').innerHTML = groups.map(group => `
    <div class="nav-group-label">${group.title}</div>
    <div class="nav-list">
      ${group.items.map(([id, icon, label]) => `
        <button class="nav-item ${active === id ? 'active' : ''}" onclick="go('${id}')">
          <i data-lucide="${icon}"></i>
          <span class="nav-label">${label}</span>
          ${id === 'carrito' && count ? `<span class="pill ${bounceCart ? 'badge-bounce' : ''}">${count}</span>` : ''}
        </button>
      `).join('')}
    </div>
  `).join('');

  const flatItems = groups.flatMap(g => g.items).slice(0, 4);
  $('mobileBottomNav').innerHTML = flatItems.map(([id, icon, label]) => `
    <button class="${active === id ? 'active' : ''}" onclick="go('${id}')">
      <i data-lucide="${icon}"></i>
      <span>${label.split(' ')[0]}</span>
    </button>
  `).join('');

  const currentItem = groups.flatMap(g => g.items).find(([id]) => id === active);
  $('pageCrumb').textContent = currentItem ? currentItem[2] : 'Inicio';

  const quickBtn = $('quickActionBtn');
  if (role === 'admin') {
    quickBtn.innerHTML = `<i data-lucide="plus"></i><span>Nuevo insumo</span>`;
    quickBtn.onclick = () => go('inventario');
  } else if (role === 'ventas') {
    quickBtn.innerHTML = `<i data-lucide="shopping-cart"></i><span>Cobrar (${count})</span>`;
    quickBtn.onclick = () => go('carrito');
  } else {
    quickBtn.innerHTML = `<i data-lucide="scan-line"></i><span>Diagnosticar</span>`;
    quickBtn.onclick = () => go('diagnostico');
  }

  lucide.createIcons();
}

function go(v) {
  active = v;
  toggleSidebar(false);
  buildNav();

  const pages = {
    inicio,
    diagnostico,
    tienda,
    guia: botanicalGuidePage,
    misdiagnosticos,
    carrito: cartPage,
    admin: adminPage,
    ventas: salesPage,
    inventario: inventoryPage,
    diagnosticos: diagnosesPage
  };

  const container = $('content');
  container.classList.remove('view-enter');
  void container.offsetWidth;
  container.innerHTML = (pages[v] || inicio)();
  container.classList.add('view-enter');

  if (v === 'diagnostico') bindUpload();
  lucide.createIcons();
}

function getRecommendedProductsForSymptom(symptom) {
  const map = {
    amarillas: ['abonos', 'sustratos'],
    crecimiento: ['abonos'],
    plaga: ['plagas'],
    manchas: ['plagas', 'sustratos'],
    marchita: ['sustratos', 'herramientas'],
    otro: ['abonos', 'sustratos']
  };
  const preferredCats = map[symptom] || ['abonos'];
  const matches = inventory.filter(p => preferredCats.includes(detectProductCategory(p)));
  return (matches.length ? matches : inventory).slice(0, 2);
}

function handleSelectedFile(file) {
  if (!file) return;
  if (!ALLOWED_TYPES.includes(file.type)) {
    toast('Formato no permitido. Usa JPG, PNG o WEBP.');
    return;
  }
  if (file.size > MAX_IMAGE_BYTES) {
    toast('La imagen supera el tamaño máximo de 5 MB.');
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    previewData = e.target.result;
    $('photoPreview').src = previewData;
    $('previewWrap').classList.remove('hidden');
  };
  reader.readAsDataURL(file);
}

function bindUpload() {
  const fileInput = $('plantPhoto');
  const dropzone = $('dropzone');
  if (!fileInput || !dropzone) return;

  fileInput.addEventListener('change', () => handleSelectedFile(fileInput.files[0]));

  ['dragenter', 'dragover'].forEach(evt => {
    dropzone.addEventListener(evt, e => {
      e.preventDefault();
      dropzone.classList.add('drag-over');
    });
  });

  ['dragleave', 'drop'].forEach(evt => {
    dropzone.addEventListener(evt, e => {
      e.preventDefault();
      dropzone.classList.remove('drag-over');
    });
  });

  dropzone.addEventListener('drop', e => {
    const file = e.dataTransfer?.files?.[0];
    if (file) handleSelectedFile(file);
  });
}

function removePhoto() {

  const fileInput = $('plantPhoto');

}

function calculateFertilizerDose() {
  const pot = Number($('calcPotSize')?.value || 20);
  const type = $('calcType')?.value || 'humus';
  const state = $('calcSeason')?.value || 'crecimiento';
  const target = $('doseResult');
  if (!target) return;

  const factor = pot <= 14 ? 1 : pot <= 22 ? 2 : pot <= 35 ? 4 : 7;
  const stateMult = state === 'recuperacion' ? 0.5 : 1;

  let doseText = '';
  let freqText = '';
  let tipText = '';

  if (type === 'humus') {
    const spoons = Math.max(1, Math.round(2 * factor * stateMult));
    doseText = `${spoons} cucharada${spoons > 1 ? 's' : ''} sopera${spoons > 1 ? 's' : ''} (aprox. ${spoons * 15} g)`;
    freqText = 'Cada 30 días sobre la superficie del sustrato.';
    tipText = 'Remueve suavemente los primeros 2 cm de tierra y riega después para activar los nutrientes.';
  } else if (type === 'npk') {
    const grams = Math.max(2, Math.round(3 * factor * stateMult));
    doseText = `${grams} gramos (aprox. ${(grams / 5).toFixed(1)} cucharaditas)`;
    freqText = state === 'recuperacion' ? 'Esperar 3 semanas tras el trasplante antes de aplicar.' : 'Cada 45 a 60 días.';
    tipText = 'Esparce los gránulos lejos del tallo principal y riega abundantemente.';
  } else {
    const ml = Math.max(2, Math.round(2.5 * factor * stateMult));
    const waterMl = Math.round(250 * factor);
    doseText = `${ml} ml de abono líquido disueltos en ${waterMl} ml de agua`;
    freqText = 'Cada 15 días en época de crecimiento.';
    tipText = 'Nunca apliques abono líquido sobre sustrato completamente seco; humedece un poco antes.';
  }

  target.innerHTML = `
    <div class="view-enter">
      <div class="diag-block">
        <h4>Cantidad sugerida</h4>
        <p style="margin:0;font-weight:800;font-size:1.05rem;color:var(--green-dark)">${doseText}</p>
      </div>
      <div class="diag-block">
        <h4>Frecuencia</h4>
        <p style="margin:0">${freqText}</p>
      </div>
      <div class="diag-block" style="margin-bottom:0">
        <h4>Consejo de aplicación</h4>
        <p style="margin:0">${tipText}</p>
      </div>
    </div>
  `;
}

function saveCart(bounce = false) {
  localStorage.setItem('plantiaCart', JSON.stringify(cart));
  buildNav(bounce);
}

function reconcileCartWithStock() {
  if (!inventory.length) return;
  let changed = false;
  cart = cart.reduce((acc, item) => {
    const product = inventory.find(p => Number(p.id) === Number(item.id));
    if (!product) {
      changed = true;
      return acc;
    }
    const maxStock = Number(product.stock);
    if (Number.isFinite(maxStock)) {
      if (maxStock <= 0) {
        changed = true;
        return acc;
      }
      if (item.qty > maxStock) {
        item.qty = maxStock;
        changed = true;
      }
    }
    item.price = Number(product.price) || item.price;
    item.name = product.name || item.name;
    acc.push(item);
    return acc;
  }, []);
  if (changed) localStorage.setItem('plantiaCart', JSON.stringify(cart));
}

function getCartQty(productId) {
  const item = cart.find(c => Number(c.id) === Number(productId));
  return item ? Number(item.qty) || 0 : 0;
}

function getAvailableStock(product) {
  const baseStock = Number(product.stock);
  if (!Number.isFinite(baseStock)) return Infinity;
  return Math.max(0, baseStock - getCartQty(product.id));
}

function addToCart(productId) {
  const item = inventory.find(p => Number(p.id) === Number(productId));
  if (!item) return;

  const available = getAvailableStock(item);
  if (available <= 0) {
    toast(`No hay más stock disponible de ${item.name}.`);
    return;
  }

  const existing = cart.find(c => Number(c.id) === Number(productId));
  if (existing) existing.qty += 1;
  else cart.push({ id: item.id, name: item.name, price: Number(item.price) || 0, qty: 1 });

  saveCart(true);
  if (active === 'tienda') renderProductsGrid();
  toast(`${item.name} agregado al carrito.`);
}

function updateCartQty(productId, delta) {
  const idx = cart.findIndex(c => Number(c.id) === Number(productId));
  if (idx === -1) return;

  const product = inventory.find(p => Number(p.id) === Number(productId));
  const maxStock = product && Number.isFinite(Number(product.stock)) ? Number(product.stock) : Infinity;
  const nextQty = cart[idx].qty + delta;

  if (nextQty <= 0) {
    cart.splice(idx, 1);
  } else if (nextQty > maxStock) {
    toast(`Stock máximo disponible: ${maxStock}`);
    return;
  } else {
    cart[idx].qty = nextQty;
  }

  saveCart(delta > 0);
  if (active === 'carrito') go('carrito');
}

function removeFromCart(productId) {
  cart = cart.filter(c => Number(c.id) !== Number(productId));
  saveCart();
  if (active === 'carrito') go('carrito');
}

function renderProductsGrid() {
  const grid = $('productsGrid');
  if (!grid) return;

  if (isLoadingData && !inventory.length) {
    grid.innerHTML = Array.from({ length: 4 }).map(() => `
      <div class="card">
        <div class="skeleton" style="height:172px;margin-bottom:14px"></div>
        <div class="skeleton" style="height:20px;width:70%;margin-bottom:8px"></div>
        <div class="skeleton" style="height:14px;width:95%"></div>
      </div>
    `).join('');
    return;
  }

  const q = productSearchQuery.trim().toLowerCase();
  const filtered = inventory.filter(p => {
    const cat = detectProductCategory(p);
    const matchesCat = selectedCategory === 'todos' || cat === selectedCategory;
    const matchesQuery = !q ||
      String(p.name || '').toLowerCase().includes(q) ||
      String(p.description || '').toLowerCase().includes(q);
    return matchesCat && matchesQuery;
  });

  grid.innerHTML = filtered.map(p => {
    const hasStock = Number.isFinite(Number(p.stock));
    const available = getAvailableStock(p);
    const outOfStock = hasStock && available <= 0;
    const lowStock = hasStock && available > 0 && available <= 5;
    const imgSrc = safeImageUrl(p.image_url);
    const catId = detectProductCategory(p);
    const catLabel = getCategoryLabel(catId);

    let stockHtml = '';
    if (hasStock) {
      if (outOfStock) stockHtml = `<span class="stock-badge out">Agotado</span>`;
      else if (lowStock) stockHtml = `<span class="stock-badge low">¡Últimas ${available} uds!</span>`;
      else stockHtml = `<span class="stock-badge ok">Disponibles: ${available}</span>`;
    }

    return `
      <article class="card hoverable product-card">
        <div>
          <div class="product-img-box">
            <span class="cat-tag">${escapeHtml(catLabel)}</span>
            ${imgSrc
              ? `<img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(p.name)}" onerror="this.remove()">`
              : `<i data-lucide="sprout" style="width:42px;height:42px;opacity:.55"></i>`}
          </div>
          <h3>${escapeHtml(p.name)}</h3>
          <p class="muted" style="margin:0;font-size:.9rem">${escapeHtml(cleanDescription(p.description))}</p>
          ${stockHtml}
        </div>
        <div class="product-foot">
          <span class="price">${money(p.price)}</span>
          <button class="btn sm" ${outOfStock ? 'disabled' : ''} onclick="addToCart(${p.id})">
            <i data-lucide="${outOfStock ? 'ban' : 'plus'}"></i>${outOfStock ? 'Sin stock' : 'Agregar'}
          </button>
        </div>
      </article>
    `;
  }).join('') || `
    <div class="card empty-state" style="grid-column:1/-1">
      <div class="iconbox"><i data-lucide="search-x"></i></div>
      <p class="muted" style="margin:0 0 12px">No encontramos insumos en esta categoría o búsqueda.</p>
      <button class="btn secondary sm" onclick="selectedCategory='todos';productSearchQuery='';go('tienda')">Ver todos los productos</button>
    </div>
  `;

  lucide.createIcons();
}

function tienda() {
  setTimeout(renderProductsGrid, 0);
  return `
    <div class="section-head">
      <div>
        <h2>Tienda de Insumos Botánicos</h2>
        <p class="muted">Abonos orgánicos, fertilizantes NPK, sustratos, control de plagas y herramientas.</p>
      </div>
      <input
        class="search-input"
        placeholder="Buscar humus, NPK, perlita, neem..."
        value="${escapeHtml(productSearchQuery)}"
        oninput="productSearchQuery=this.value;renderProductsGrid()"
      >
    </div>

    <div id="categoryChips" class="chip-bar">
      ${CATEGORIES.map(c => `
        <button type="button" data-cat="${c.id}" class="chip ${selectedCategory === c.id ? 'active' : ''}" onclick="setCategoryFilter('${c.id}')">
          <i data-lucide="${c.icon}" style="width:15px;height:15px"></i>
          <span>${c.label}</span>
        </button>
      `).join('')}
    </div>

    <div id="productsGrid" class="grid stagger"></div>
  `;
}

function cartPage() {
  const total = cart.reduce((s, x) => s + x.price * x.qty, 0);
  return `
    <div class="section-head">
      <div>
        <h2>${role === 'ventas' ? 'Caja / Cobro' : 'Mi carrito'}</h2>
        <p class="muted">Revisa cantidades antes de confirmar.</p>
      </div>
      <button class="btn secondary sm" onclick="go('tienda')"><i data-lucide="arrow-left"></i>Seguir comprando</button>
    </div>

    <div class="card">
      ${cart.length ? `
        <div class="tablewrap">
          <table>
            <thead>
              <tr><th>Producto</th><th>Precio</th><th>Cantidad</th><th>Subtotal</th><th></th></tr>
            </thead>
            <tbody>
              ${cart.map(x => `
                <tr>
                  <td><strong>${escapeHtml(x.name)}</strong></td>
                  <td>${money(x.price)}</td>
                  <td>
                    <div class="qty-stepper">
                      <button type="button" aria-label="Disminuir" onclick="updateCartQty(${x.id}, -1)">-</button>
                      <span>${x.qty}</span>
                      <button type="button" aria-label="Aumentar" onclick="updateCartQty(${x.id}, 1)">+</button>
                    </div>
                  </td>
                  <td><strong>${money(x.price * x.qty)}</strong></td>
                  <td style="text-align:right">
                    <button type="button" class="btn secondary xs" aria-label="Quitar" onclick="removeFromCart(${x.id})">
                      <i data-lucide="trash-2"></i>
                    </button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>

        <div class="field" style="max-width:320px;margin-top:18px">
          <label for="paymentMethod">Método de pago</label>
          <select id="paymentMethod">
            <option value="Efectivo">Efectivo</option>
            <option value="Nequi / Daviplata">Nequi / Daviplata</option>
            <option value="Tarjeta">Tarjeta</option>
            <option value="Transferencia">Transferencia</option>
          </select>
        </div>

        <div class="cart-total-row">
          <div style="font-size:1.25rem"><strong>Total: ${money(total)}</strong></div>
          <button id="checkoutBtn" class="btn" onclick="checkout()"><i data-lucide="check-circle-2"></i>Confirmar compra</button>
        </div>
      ` : `
        <div class="empty-state">
          <div class="iconbox"><i data-lucide="shopping-cart"></i></div>
          <p class="muted" style="margin:0 0 14px">Tu carrito está vacío por ahora.</p>
          <button class="btn sm" onclick="go('tienda')">Explorar catálogo</button>
        </div>
      `}
    </div>
  `;
}

async function checkout() {
  if (!cart.length) return;
  const payment_method = $('paymentMethod') ? $('paymentMethod').value : 'Efectivo';
  const btn = $('checkoutBtn');
  if (btn) btn.disabled = true;

  try {
    await apiFetch('/api/ventas', {
      method: 'POST',
      body: JSON.stringify({
        payment_method,
        items: cart.map(x => ({ product_id: x.id, quantity: x.qty }))
      })
    });
    cart = [];
    saveCart();
    await refreshData();
    toast('Compra registrada correctamente.');
    go(role === 'ventas' ? 'ventas' : 'tienda');
  } catch (err) {
    toast(err.message);
  } finally {
    if (btn) btn.disabled = false;
  }
}

function misdiagnosticos() {
  return `
    <div class="section-head">
      <div>
        <h2>${role === 'admin' ? 'Historial de diagnósticos' : 'Mis diagnósticos'}</h2>
        <p class="muted">Evaluaciones registradas en la plataforma.</p>
      </div>
      ${role === 'cliente' ? `<button class="btn sm" onclick="go('diagnostico')"><i data-lucide="plus"></i>Nuevo diagnóstico</button>` : ''}
    </div>
    <div class="card">
      <div class="tablewrap">
        <table>
          <thead><tr><th>Planta</th><th>Síntoma</th><th>Resultado</th></tr></thead>
          <tbody>
            ${diagnoses.map(d => `
              <tr>
                <td><strong>${escapeHtml(d.plant_name || '')}</strong></td>
                <td>${escapeHtml(d.symptom || '')}</td>
                <td>${escapeHtml(d.diagnosis || d.result || '')}</td>
              </tr>
            `).join('') || '<tr><td colspan="3" class="muted">Sin diagnósticos registrados.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function adminPage() {
  const totalRevenue = salesHistory.reduce((acc, s) => acc + (Number(s.total) || 0), 0);
  const lowStockCount = inventory.filter(p => Number.isFinite(Number(p.stock)) && Number(p.stock) <= 5).length;

  return `
    <div class="section-head">
      <div>
        <h2>Panel de administración</h2>
        <p class="muted">Resumen general de operación de PlantIA.</p>
      </div>
      <button class="btn sm" onclick="go('inventario')"><i data-lucide="plus-circle"></i>Gestionar abonos e insumos</button>
    </div>
    <div class="grid stagger">
      <article class="card hoverable">
        <div class="iconbox"><i data-lucide="boxes"></i></div>
        <h3>Insumos en catálogo</h3>
        <p class="stat-value">${inventory.length}</p>
        <p class="muted" style="margin:6px 0 0;font-size:.84rem">${lowStockCount} con stock bajo</p>
      </article>
      <article class="card hoverable">
        <div class="iconbox"><i data-lucide="clipboard-list"></i></div>
        <h3>Diagnósticos IA</h3>
        <p class="stat-value">${diagnoses.length}</p>
      </article>
      <article class="card hoverable">
        <div class="iconbox"><i data-lucide="receipt"></i></div>
        <h3>Ventas registradas</h3>
        <p class="stat-value">${salesHistory.length}</p>
        <p class="muted" style="margin:6px 0 0;font-size:.84rem">Ingresos: ${money(totalRevenue)}</p>
      </article>
    </div>
  `;
}

function salesPage() {
  return `
    <div class="section-head">
      <div>
        <h2>Historial de ventas</h2>
        <p class="muted">Transacciones realizadas.</p>
      </div>
      ${role === 'ventas' ? `<button class="btn sm" onclick="go('tienda')"><i data-lucide="plus"></i>Nueva venta</button>` : ''}
    </div>
    <div class="card">
      <div class="tablewrap">
        <table>
          <thead><tr><th>ID</th><th>Método</th><th>Total</th></tr></thead>
          <tbody>
            ${salesHistory.map(s => `
              <tr>
                <td><strong>#${escapeHtml(s.id)}</strong></td>
                <td>${escapeHtml(s.payment_method || 'N/A')}</td>
                <td><strong>${money(s.total)}</strong></td>
              </tr>
            `).join('') || '<tr><td colspan="3" class="muted">Sin ventas registradas.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function inventoryPage() {
  const existingNames = new Set(inventory.map(p => String(p.name || '').toLowerCase().trim()));
  const missingPresets = BOTANICAL_PRESETS.filter(p => !existingNames.has(p.name.toLowerCase().trim()));

  return `
    <div class="section-head">
      <div>
        <h2>Inventario de Abonos e Insumos</h2>
        <p class="muted">Crea productos personalizados o carga insumos botánicos prediseñados en un clic.</p>
      </div>
      ${missingPresets.length ? `
        <button id="seedAllBtn" class="btn gold sm" onclick="seedAllBotanicalPresets()">
          <i data-lucide="sparkles"></i>Cargar ${missingPresets.length} insumos sugeridos
        </button>
      ` : ''}
    </div>

    ${missingPresets.length ? `
      <section class="card" style="margin-bottom:20px">
        <h3 style="margin-bottom:4px">Plantillas rápidas de abonos y cuidado</h3>
        <p class="muted" style="margin:0;font-size:.88rem">Haz clic en <strong>+ Agregar</strong> para publicar cualquiera de estos insumos directamente en tu tienda.</p>
        <div class="preset-list">
          ${missingPresets.map((preset, idx) => `
            <div class="preset-item">
              <div>
                <span class="role-badge" style="margin-bottom:4px">${escapeHtml(getCategoryLabel(preset.category))}</span>
                <strong>${escapeHtml(preset.name)}</strong>
                <small>${money(preset.price)} · Stock: ${preset.stock}</small>
              </div>
              <button type="button" class="btn xs" onclick="addPresetProduct(${idx})">
                <i data-lucide="plus"></i>Agregar al catálogo
              </button>
            </div>
          `).join('')}
        </div>
      </section>
    ` : ''}

    <div class="diagnostic-layout">
      <section class="card">
        <h3>Crear nuevo insumo</h3>
        <div class="field">
          <label for="newProdCategory">Categoría botánica</label>
          <select id="newProdCategory">
            ${CATEGORIES.filter(c => c.id !== 'todos').map(c => `
              <option value="${c.id}">${c.label}</option>
            `).join('')}
          </select>
        </div>
        <div class="field">
          <label for="newProdName">Nombre del producto</label>
          <input id="newProdName" placeholder="Ej. Humus de lombriz 2kg, Abono NPK, Perlita...">
        </div>
        <div class="field">
          <label for="newProdPrice">Precio (COP)</label>
          <input id="newProdPrice" type="number" min="0" step="100" placeholder="22000">
        </div>
        <div class="field">
          <label for="newProdStock">Stock inicial</label>
          <input id="newProdStock" type="number" min="0" step="1" value="15">
        </div>
        <div class="field">
          <label for="newProdDesc">Descripción y modo de uso</label>
          <textarea id="newProdDesc" rows="3" placeholder="Composición, beneficios y frecuencia de aplicación..."></textarea>
        </div>
        <div class="field">
          <label for="newProdImg">URL de imagen (opcional)</label>
          <input id="newProdImg" type="url" placeholder="https://...">
        </div>
        <button id="createProductBtn" class="btn full" onclick="createProduct()">
          <i data-lucide="plus-circle"></i>Guardar en inventario
        </button>
      </section>

      <section class="card">
        <h3>Catálogo actual (${inventory.length})</h3>
        <div class="tablewrap">
          <table>
            <thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th></tr></thead>
            <tbody>
              ${inventory.map(p => {
                const st = Number(p.stock);
                const badgeClass = !Number.isFinite(st) ? 'ok' : st <= 0 ? 'out' : st <= 5 ? 'low' : 'ok';
                const catLabel = getCategoryLabel(detectProductCategory(p));
                return `
                  <tr>
                    <td><strong>${escapeHtml(p.name)}</strong></td>
                    <td><span class="role-badge">${escapeHtml(catLabel)}</span></td>
                    <td>${money(p.price)}</td>
                    <td><span class="stock-badge ${badgeClass}" style="margin:0">${escapeHtml(p.stock ?? '-')}</span></td>
                  </tr>
                `;
              }).join('') || '<tr><td colspan="4" class="muted">Sin productos aún.</td></tr>'}
            </tbody>
          </table>
        </div>
      </section>
    </div>
  `;
}

async function addPresetProduct(missingIndex) {
  const existingNames = new Set(inventory.map(p => String(p.name || '').toLowerCase().trim()));
  const missingPresets = BOTANICAL_PRESETS.filter(p => !existingNames.has(p.name.toLowerCase().trim()));
  const preset = missingPresets[missingIndex];
  if (!preset) return;

  try {
    await apiFetch('/api/productos', {
      method: 'POST',
      body: JSON.stringify({
        name: preset.name,
        price: preset.price,
        stock: preset.stock,
        description: preset.description,
        image_url: null
      })
    });
    await loadProducts();
    go('inventario');
    toast(`${preset.name} agregado al catálogo.`);
  } catch (err) {
    toast(err.message);
  }
}

async function seedAllBotanicalPresets() {
  const existingNames = new Set(inventory.map(p => String(p.name || '').toLowerCase().trim()));
  const missingPresets = BOTANICAL_PRESETS.filter(p => !existingNames.has(p.name.toLowerCase().trim()));
  if (!missingPresets.length) return;

  const btn = $('seedAllBtn');
  if (btn) btn.disabled = true;

  try {
    for (const preset of missingPresets) {
      await apiFetch('/api/productos', {
        method: 'POST',
        body: JSON.stringify({
          name: preset.name,
          price: preset.price,
          stock: preset.stock,
          description: preset.description,
          image_url: null
        })
      });
    }
    await loadProducts();
    go('inventario');
    toast(`Se agregaron ${missingPresets.length} insumos botánicos.`);
  } catch (err) {
    toast(err.message);
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function createProduct() {
  const category = $('newProdCategory').value;
  const catLabel = getCategoryLabel(category);
  const name = $('newProdName').value.trim();
  const price = Number($('newProdPrice').value);
  const stock = Number($('newProdStock').value);
  const rawDesc = $('newProdDesc').value.trim();
  const description = `[${catLabel}] ${rawDesc}`.trim();
  const rawImg = $('newProdImg').value.trim();
  const btn = $('createProductBtn');

  if (!name) {
    toast('Escribe el nombre del producto.');
    return;
  }
  if (!Number.isFinite(price) || price < 0) {
    toast('Ingresa un precio válido.');
    return;
  }
  if (!Number.isInteger(stock) || stock < 0) {
    toast('Ingresa un stock válido.');
    return;
  }
  if (rawImg && !safeImageUrl(rawImg)) {
    toast('La URL de imagen debe iniciar con http:// o https://');
    return;
  }

  btn.disabled = true;
  try {
    await apiFetch('/api/productos', {
      method: 'POST',
      body: JSON.stringify({ name, price, stock, description, image_url: rawImg || null })
    });
    await loadProducts();
    go('inventario');
    toast('Insumo agregado al inventario.');
  } catch (err) {
    toast(err.message);
  } finally {
    btn.disabled = false;
  }
}

function diagnosesPage() {
  return misdiagnosticos();
}

const origGo = go;
go = function(v) {
  origGo(v);
  if (v === 'guia') calculateFertilizerDose();
};

restoreSession();
lucide.createIcons();
</script>
</body>
</html>
